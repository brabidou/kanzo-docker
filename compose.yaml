# docker compose up -d   then open http://localhost:4242
services:
  kanzo:
    image: ghcr.io/brabidou/kanzo:latest
    # Or build it here instead of pulling: `docker compose up -d --build`
    build: .
    container_name: kanzo
    restart: unless-stopped
    ports:
      # host:container. Change only the left side to use another port.
      - "4242:4242"
    volumes:
      - kanzo-data:/data

volumes:
  kanzo-data:
