# Builds and publishes the image whenever upstream Kanzo publishes a new release.
#
# We can't add a webhook to emanuele-em/kanzo, so this polls its latest release on a
# schedule and builds only when ghcr.io doesn't have that version yet. A push here, or a
# manual run, rebuilds so changes to the Dockerfile ship right away.
name: docker

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  push:
    branches: [main]
    paths: [Dockerfile, docker-entrypoint.sh, Caddyfile, .github/workflows/docker.yml]
  pull_request:
    paths: [Dockerfile, docker-entrypoint.sh, Caddyfile, .github/workflows/docker.yml]
  workflow_dispatch:
    inputs:
      version:
        description: "Kanzo version to build, like 0.4.2 (empty: the latest release)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM: emanuele-em/kanzo
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Pick the version and decide whether to build
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
        run: |
          set -eu
          latest=$(gh release view -R "$UPSTREAM" --json tagName --jq .tagName)
          latest=${latest#v}
          version=${INPUT:-$latest}
          version=${version#v}
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kanzo"

          tags="$image:$version,$image:${version%.*}"
          # Only the newest upstream release moves :latest, so rebuilding an old one can't.
          [ "$version" = "$latest" ] && tags="$tags,$image:latest"

          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] && docker buildx imagetools inspect "$image:$version" >/dev/null 2>&1; then
            echo "$image:$version already exists; nothing to do."
            build=false
          fi

          {
            echo "version=$version"
            echo "image=$image"
            echo "tags=$tags"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

      - if: steps.v.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4.4.0
      - if: steps.v.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4.4.1

      # Check the image actually serves the board before anything is published.
      - name: Build for amd64 and smoke test
        if: steps.v.outputs.build == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: kanzo:test
          build-args: KANZO_VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        if: steps.v.outputs.build == 'true'
        run: |
          set -eu
          docker run -d --name kanzo -p 4242:4242 kanzo:test
          for _ in $(seq 30); do
            curl -fsS http://localhost:4242/api/ping && exit 0
            sleep 1
          done
          docker logs kanzo
          exit 1

      - name: Log in to ghcr.io
        if: steps.v.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build for every platform and push
        if: steps.v.outputs.build == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.v.outputs.tags }}
          build-args: KANZO_VERSION=${{ steps.v.outputs.version }}
          # Links the package to this repo, so it shows on the repo page and inherits its visibility.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
